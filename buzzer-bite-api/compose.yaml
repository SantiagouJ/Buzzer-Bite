services:
  postgres:
    image: postgres:17-alpine
    container_name: buzzer-bite-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: buzzer_bite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - buzzer_bite_data:/var/lib/postgresql/data

volumes:
  buzzer_bite_data: